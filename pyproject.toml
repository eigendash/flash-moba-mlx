[project]
name = "moba-mlx"
version = "0.1.0"
description = "Toy MLX implementation of block-sparse Mixture of Block Attention with a router, a tiled kernel and a tile-schedule visualisation"
requires-python = ">=3.10"
dependencies = ["mlx>=0.22", "numpy"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
